# xspct-scan example configuration
# Pass this file as the first argument:
#   xspct-scan /etc/xspct_scan/config.yml

# Listen addresses (list or single string)
xspct_listen_address:
  - '0.0.0.0'

xspct_listen_port: 8080
xspct_listen_backlog: 256

# Logging: 10=DEBUG  20=INFO  30=WARNING  40=ERROR
xspct_log_level: 20
xspct_log_prefix: 'xspct-scan'

# API key authentication (leave empty to disable)
xspct_api_header: 'X-Api-Key'
xspct_api_key: ''            # single string or YAML list for key rotation
xspct_api_key_verify_fail: true

# Admin API key for POST /admin/reload (leave empty to disable admin endpoints)
xspct_admin_api_key: ''      # single string or YAML list

# Rspamd correlation header
xspct_rspamd_header: 'X-Rspamd-ID'

# TLS (optional)
xspct_tls:
  tls_enabled: false
  tls_cert: ''
  tls_key: ''

# ClamAV engine (optional — requires: pip install "xspct_scan[enrichment]" and a running clamd)
# Scans every file regardless of type. Results are included in the report as 'clamav'
# and any detections are also added to the 'analyses' list as type 'ClamAV'.
#
# Connection: set 'socket' to the clamd Unix socket path (recommended for local setups).
# Leave 'socket' empty to use TCP (host + port).
#
# Rule of thumb: set xspct_foreground_slots + xspct_background_slots ≤ clamd MaxThreads.
xspct_clamav:
  enabled: false
  socket: /var/run/clamav/clamd.ctl   # non-empty → Unix socket; empty → TCP
  host: 127.0.0.1
  port: 3310
  timeout: 60         # per-scan timeout in seconds
  max_size: 26214400  # 25 MB — files larger than this are skipped
  # When true (default), each file extracted from an archive is also passed to
  # ClamAV individually. clamd already unpacks archives internally, so set this
  # to false to avoid double-scanning and reduce clamd load.
  scan_members: true

# Redis result cache (optional)
xspct_redis_cache:
  enabled: false
  host: localhost
  port: 6379
  user: ''
  password: ''
  prefix: 'xspct:'
  expire: 3600      # seconds
  max_errors: 3     # circuit-breaker threshold

# Periodic stats logging
xspct_stats_enabled: true
xspct_stats_interval: 60    # seconds

# Password list for decrypting encrypted Office documents
# Single file path or YAML list of paths (all are loaded and merged).
xspct_password_file: '10k-most-common.txt'

# Per-analyzer enable/disable and analyzer-specific settings.
# Only specify the keys you want to override — defaults are deep-merged.
xspct_analyzers:
  pdf:        {enabled: true}
  html:       {enabled: true}
  office:     {enabled: true}
  yara:       {enabled: false, rules_path: ''}   # classic yara-python engine
  yara_x:     {enabled: false, rules_path: ''}   # modern yara-x (Rust) engine — enable both for comparison
  image:      {enabled: true}
  archive:    {enabled: true}
  iocs:       {enabled: true}
  javascript: {enabled: true, quickjs: false}  # set quickjs: true to enable sandboxed JS emulation
  text:       {enabled: true}   # plain-text / script files (feeds YARA + iocsearcher)

# When true (default), 'text_preview' (a list of {source, text} truncated
# excerpts, one per extractor) is included in every response.
xspct_include_text_preview: true

# When true, 'text_full' (a list of {source, text} segments at full length) is
# returned. When false (default), 'text_full' is an empty list in the response.
xspct_include_text_full: false

# Response serialization format.
# auto    - negotiate from Accept header, then Content-Type, then fall back to JSON
# json    - always return application/json (default behaviour)
# msgpack - always return application/x-msgpack  (requires xspct-scan[serialization])
# cbor    - always return application/cbor        (requires xspct-scan[serialization])
xspct_response_format: auto

# Maximum characters per 'text_preview' segment (the short excerpt included in
# every response). Keep this small for low-latency API consumers.
xspct_text_preview_length: 2000

# Maximum characters per extracted-text segment, used by iocsearcher
# and (when xspct_include_text_full is true) for the 'text_full' report field.
# Set higher to improve IOC recall on long documents.
xspct_text_max_length: 50000

# Maximum archive nesting depth (0 = no extraction).
xspct_archive_max_depth: 2

# Maximum total bytes extracted from a single archive (default 50 MB).
xspct_archive_max_size: 52428800

# Fall back to stdlib zipfile / py7zr when sflock2 is unavailable or fails.
# Disabled by default: the stdlib extractors run without a sandbox so they
# should only be enabled in trusted environments or when sflock2 cannot be
# installed.
xspct_archive_stdlib_fallback: false

# When true, partial reports (from timed-out requests) are also cached.
xspct_cache_partial: false

# ---------------------------------------------------------------------------
# Two-tier concurrency
# ---------------------------------------------------------------------------
# Foreground slots: maximum concurrent scans that are actively holding a
# client/Rspamd connection open. When all slots are taken and a new request
# arrives, it waits up to its 'timeout' seconds; if still no slot it receives
# 503.
#
# Background slots: maximum concurrent scans that already returned 202 and
# continue in the background. When a scan times out and no background slot
# is free the scan is cancelled immediately so foreground capacity is preserved.
#
# Rule of thumb: total (foreground + background) ≤ downstream worker threads
# (e.g. clamd MaxThreads).  Start with 80/20 split and adjust via metrics:
#   xspct_foreground_overloaded — raise foreground_slots or reduce load
#   xspct_background_rejected   — raise background_slots or reduce scan time
xspct_foreground_slots: 16
xspct_background_slots: 4

# ---------------------------------------------------------------------------
# IOC URL / domain exclusion list
# ---------------------------------------------------------------------------
# Hostnames (or domain suffixes) to silently drop from the 'urls' and
# 'domains' fields in every report.  A URL is excluded when its hostname
# equals an entry OR is a subdomain of it (e.g. 'w3.org' also excludes
# 'www.w3.org').  Extend this list with any benign boilerplate domains
# that appear in your document corpus (CDN hosts, schema namespaces, …).
xspct_ioc_url_exclude_domains:
  - w3.org
  - schema.org
  - schemas.microsoft.com
  - schemas.openxmlformats.org
  - purl.org
  - dublincore.org
  - xmlsoap.org
  - ns.adobe.com
  - creativecommons.org
  - opengis.net
  - xhtml1-transitional.dtd

# ---------------------------------------------------------------------------
# Archive extraction backend
# ---------------------------------------------------------------------------
# When SFlock2 is installed (pip install "xspct_scan[advanced]") it is used
# automatically for all archive types (ZIP, 7z, RAR, TAR, CAB, ACE, ISO,
# EML, MSG, …).  Extraction runs inside the zipjail usermode sandbox.
# Without SFlock2 the fallback uses stdlib zipfile (ZIP only) + py7zr (7z).
#
# System packages required for full sflock2 support on Debian/Ubuntu:
#   apt-get install p7zip-full rar unace-nonfree cabextract lzip zpaq
