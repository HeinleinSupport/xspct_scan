[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xspct-scan"
version = "2.0.0"
description = "Async HTTP daemon for scanning Office/PDF/HTML documents for malware indicators"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "oletools>=0.60",
    "msoffcrypto-tool>=6.0",
    "python-magic>=0.4",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
uvloop = ["uvloop>=0.19"]
redis  = ["redis[asyncio]>=5.0"]
enrichment = [
    "jsbeautifier>=1.14",
    "quickjs>=1.18",
    "Pillow>=10",
    "pytesseract>=0.3",
    "pyzbar>=0.1",
]
dev    = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
    "pytest-aiohttp>=1.0",
]
openapi = [
    "pydantic>=2.0",
]
advanced = [
    "yara-python>=4.3",
    "yara-x>=0.9",
    "iocsearcher>=0.5",
    "py7zr>=0.20",
]
docs   = [
    "sphinx>=7",
    "furo>=2024",
    "sphinx-autodoc-typehints>=2",
    "myst-parser>=3",
    "sphinxcontrib-redoc>=1.6",
]

[project.scripts]
xspct-scan = "xspct_scan.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]
