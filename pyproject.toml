[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xspct-scan"
version = "2.0.0"
description = "Async HTTP daemon for scanning Office/PDF/HTML documents for malware indicators"
readme = "README.md"
license = { text = "EUPL-1.2" }
authors = [
  { name = "Carsten Rosenberg", email = "c.rosenberg@heinlein-support.de" },
]
requires-python = ">=3.10"
keywords = ["rspamd", "malware", "pdf", "office", "oletools", "aiohttp", "scanner"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: No Input/Output (Daemon)",
  "Framework :: AsyncIO",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Email :: Filters",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.9",
    "oletools>=0.60",
    "msoffcrypto-tool>=6.0",
    "python-magic>=0.4",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
uvloop = ["uvloop>=0.19"]
redis  = ["redis[asyncio]>=5.0"]
enrichment = [
    "jsbeautifier>=1.14",
    "quickjs>=1.18",
    "tree-sitter>=0.24",
    "tree-sitter-javascript>=0.23",
    "clamd>=1.0",
    "Pillow>=10",
    "pytesseract>=0.3",
    "pyzbar>=0.1",
    "easyocr>=1.7",
]
serialization = [
    "msgpack>=1.0",
    "cbor2>=5.0",
]
compression = [
    "zstandard>=0.21",
]
dev    = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
    "pytest-aiohttp>=1.0",
    "pytest-cov>=5.0",
    "fakeredis>=2.0",
    "msgpack>=1.0",
    "cbor2>=5.0",
    "zstandard>=0.21",
]
openapi = [
    "pydantic>=2.0",
]
advanced = [
    "yara-python>=4.3",
    "yara-x>=0.9",
    "iocsearcher>=0.5",
    "tldextract>=5.0",
    "py7zr>=0.20",
    "SFlock2>=0.3",
]
docs   = [
    "sphinx>=7",
    "furo>=2024",
    "sphinx-autodoc-typehints>=2",
    "myst-parser>=3",
    "sphinxcontrib-redoc>=1.6",
]

[project.urls]
Repository = "https://github.com/heinlein-support/xspct_scan"
Issues = "https://github.com/heinlein-support/xspct_scan/issues"

[project.scripts]
xspct-scan    = "xspct_scan.__main__:main"
xspct-client  = "xspct_scan.client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xspct_scan"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]
addopts     = "-v --tb=short"
filterwarnings = [
    # oletools uses the pre-3.0 pyparsing camelCase API
    "ignore::pyparsing.exceptions.PyparsingDeprecationWarning",
    # clamd still imports pkg_resources
    "ignore:pkg_resources is deprecated:DeprecationWarning:clamd",
    # sphinxcontrib namespace package uses legacy pkg_resources.declare_namespace
    "ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning:pkg_resources",
    # easyocr / torch quantization API scheduled for removal in torch 2.10
    "ignore:.*torch.ao.quantization.*:DeprecationWarning",
    "ignore:.*torch.quantization.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/xspct_scan"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
